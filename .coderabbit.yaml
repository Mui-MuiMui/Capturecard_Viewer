# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# CodeRabbit のレビュー設定。
# このファイルはリポジトリのルートに置く必要があり、レビュー対象 PR の
# head ブランチにあるものが読まれる。

language: "ja-JP"

reviews:
  profile: "chill"

  # 装飾的な出力は切る。要約は残す
  poem: false
  in_progress_fortune: false
  high_level_summary: true

  auto_review:
    enabled: true
    # 既定ブランチ（main）以外でレビュー対象にするベースブランチ。正規表現。
    # このリポジトリの PR は原則 dev へ向けるため、dev を含めないと
    # 「Auto reviews are disabled on base/target branches other than the
    # default branch」でスキップされる
    base_branches:
      - "^dev$"

  path_instructions:
    - path: "src/**/*.rs"
      instructions: |
        - コードコメントと UI 文字列は日本語で書く。
        - `println!` / `eprintln!` を新たに追加しない。`#![windows_subsystem = "windows"]` によりコンソールが無く、出力はどこにも届かない。代わりに `log` クレートのマクロ（`error!` / `warn!` / `info!` / `debug!` / `trace!`）を使う。出力先は `src/logging.rs` がファイルへ向けている。例外は `#[cfg(test)]` の中で、テストバイナリの標準出力は `cargo test -- --nocapture` で読めるため `println!` を使ってよい。
        - serde で読み書きする設定構造体（`AppSettings` とその配下）には**構造体レベル**で `#[serde(default)]` が付いている。フィールドを追加するときは `Default` 実装に既定値を書けばよく、**フィールド単位の `#[serde(default)]` は付けない**（その型の `Default`（bool なら false）に倒れて、構造体の `Default` に書いた既定値が効かなくなる）。構造体を新設するときだけ構造体レベルの属性を付ける。
        - `Arc<Mutex<..>>` を新しく足す前に、デバイスワーカーへのコマンドで済まないかを見る。ネストしたロックは現在無く、`frames` の内側の `Mutex` はフレームコールバックと共有しているので、握ったまま重い処理をしない。
        - `///` の doc コメントは求めない。このリポジトリは `//` の日本語コメントで「なぜそうしたか」を書く方針で、docstring の網羅率は評価対象にしない。

  # マージ前チェックのうち Docstring Coverage は切る。`///` ではなく `//` の日本語コメントで
  # 説明を書く方針なので、閾値のための定型文を足す指摘が毎回出て不採用にしていた
  pre_merge_checks:
    docstrings:
      mode: "off"

  tools:
    # CI（.github/workflows/ci.yml）で cargo clippy --all-targets を回しているため、
    # 指摘の重複を避けて clippy 連携は切る。
    # CodeRabbit には設計・可読性・見落としのレビューを担当させる
    clippy:
      enabled: false

knowledge_base:
  code_guidelines:
    enabled: true
    # 既定でも **/CLAUDE.md は読まれるが、skill も合わせて読ませる
    filePatterns:
      - "**/CLAUDE.md"
      - ".claude/skills/**/*.md"
