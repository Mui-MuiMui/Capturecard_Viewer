# タグを push したら release ビルドを作り、単体の exe と SHA256SUMS.txt を GitHub Release に添付する。
#
# 手順の全体は docs/RELEASE.md を参照。ここが受け持つのはタグ push 以降だけで、
# バージョンの更新・CHANGELOG の整理・dev → main のマージは人が行う。
#
# ランナーは ci.yml と同じ理由で windows-latest 固定（rc.exe と Windows 専用の依存）。
name: Release

on:
  push:
    tags:
      # 小文字の v で始まるタグだけを対象にする。1.0.6 以前の Ver1.0.6 形式では動かない。
      # 形の検査（pre-release かどうかの判定を含む）は下の「タグと CHANGELOG の整合性」で行う
      - "v*"

# 同じタグに対する実行が重なっても、走り始めたものは打ち切らない。
# Release の作成が途中で止まると、タグだけある状態が残るため。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Release の作成と成果物の添付に書き込みが要る
permissions:
  contents: write

jobs:
  release:
    name: build / release
    runs-on: windows-latest

    env:
      # タグ名をシェルへ直接展開せず環境変数で渡す（式の埋め込みによる注入を避ける）
      TAG: ${{ github.ref_name }}

    steps:
      # 第三者の Action はタグやブランチではなく不変のコミット SHA で固定する。
      # 使っている SHA は ci.yml と揃えてあるので、更新するときは両方を直す。
      - name: リポジトリをチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Release の作成には GH_TOKEN を使うため、認証情報を .git/config に残さない
          persist-credentials: false

      - name: Rust ツールチェインを用意する
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master (2026-09-12)
        with:
          toolchain: stable

      # cargo のキャッシュ（Swatinem/rust-cache）は使わない。配布して自動更新で全員へ届く exe に、
      # 復元した target/ の依存物がそのままリンクされるのを避けるため（キャッシュポイズニングの予防）。
      # SHA256SUMS.txt は同じジョブでその exe から作るので、照合では混入を検出できない。
      # リリースは頻度が低いので、毎回クリーンビルドになって時間が伸びることは受け入れる
      # （docs/RELEASE.md の「5. ワークフローの結果を確認する」）。ci.yml のキャッシュはそのまま使う

      # ビルドの前に落とす。タグを打ち直せば済む間違いを、Release を作る前に止めるため。
      - name: タグと CHANGELOG の整合性を確認してリリースノートを作る
        run: |
          # タグの形の判定。タグの文字列だけで決まる（ローカルで関数に切り出して試せる）。
          #   受け付ける:   $tag -cmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?\z'
          #   pre-release: 受け付けたうえで $tag に '-' を含む（v1.4.0-rc.1 など）
          # 末尾を \z で固定するので v1.4.0foo / v1.4.0+build / v1.4.0- / V1.4.0 は落とす。
          # pre-release の部分に '-' を許すのは semver が識別子の中の '-' を許すため（1.4.0-rc-1）。
          # $ ではなく \z にするのは、.NET の $ が末尾の改行の手前にも一致するため。\d ではなく
          # [0-9] にするのは、.NET の \d が全角数字などにも一致するため。
          # pre-release は拒否せず、--prerelease --latest=false を付けて出す。/releases/latest が
          # rc を返すと、アプリは rc を弾く（update::is_newer_stable）ので正式版の更新も知らせなく
          # なるため（docs/RELEASE.md の「pre-release を出す」）
          $tag = ${env:TAG}
          if ($tag -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?\z') {
            throw "タグ名 $tag が v<バージョン> の形式ではない（例: v1.4.0、v1.4.0-rc.1）"
          }
          $version = $tag.Substring(1)
          $prerelease = $version.Contains('-')
          "PRERELEASE=$($prerelease.ToString().ToLowerInvariant())" | Out-File -FilePath ${env:GITHUB_ENV} -Append -Encoding utf8
          Write-Host "pre-release: $prerelease"

          # Cargo.toml を正として突き合わせる。pre-release なら Cargo.toml の version も
          # 1.4.0-rc.1 の形にしておく（タグから v を外した文字列と完全に一致させる）。
          # --locked を付けているので、
          # Cargo.lock を更新し忘れたコミットにタグを打った場合もここで落ちる
          $manifest = (cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($version -ne $manifest) {
            throw "タグ $tag と Cargo.toml の version $manifest が一致しない"
          }

          # CHANGELOG.md から該当する版の節を抜き出して Release の説明にする。
          # 見出しは `## [1.0.7] - 2026-09-19` の形。次の `## [` か `---` の手前までが本文
          $lines = Get-Content -Path CHANGELOG.md -Encoding utf8
          $heading = '^##\s*\[' + [regex]::Escape($version) + '\]'
          $start = -1
          for ($i = 0; $i -lt $lines.Length; $i++) {
            if ($lines[$i] -match $heading) { $start = $i; break }
          }
          if ($start -lt 0) {
            throw "CHANGELOG.md に $version の節が無い。未リリース節を版に切り忘れていないか"
          }

          $end = $lines.Length
          for ($i = $start + 1; $i -lt $lines.Length; $i++) {
            if ($lines[$i] -match '^##\s*\[' -or $lines[$i] -match '^---\s*$') { $end = $i; break }
          }
          if ($end -le $start + 1) {
            throw "CHANGELOG.md の $version の節が空になっている"
          }

          $body = ($lines[($start + 1)..($end - 1)] -join "`n").Trim()
          if ([string]::IsNullOrWhiteSpace($body)) {
            throw "CHANGELOG.md の $version の節が空になっている"
          }

          # 節が長いので、最初の `### ` より前（版の要約）だけを見せ、
          # 分類ごとの一覧は <details> で折りたたむ。要約が無ければ全文をそのまま出す
          $sectionLines = $lines[($start + 1)..($end - 1)]
          $firstHeading = -1
          for ($i = 0; $i -lt $sectionLines.Length; $i++) {
            if ($sectionLines[$i] -match '^###\s') { $firstHeading = $i; break }
          }
          if ($firstHeading -gt 0) {
            $intro = ($sectionLines[0..($firstHeading - 1)] -join "`n").Trim()
            $rest = ($sectionLines[$firstHeading..($sectionLines.Length - 1)] -join "`n").Trim()
            if (-not [string]::IsNullOrWhiteSpace($intro)) {
              $body = "$intro`n`n<details>`n<summary>変更の一覧（追加・変更・修正の詳細）</summary>`n`n$rest`n`n</details>"
            }
          }
          Set-Content -Path release-notes.md -Value $body -Encoding utf8

          Write-Host "リリースノート ($version):"
          Write-Host $body

      # --locked はコミット済みの Cargo.lock をそのまま使うため。
      # 配布するバイナリなので、手元と違う依存で解決されては困る
      - name: release ビルドする
        run: cargo build --locked --release

      # 配布物は exe 単体と SHA256SUMS.txt の 2 つ。icon.ico と sound/SS.mp3 は exe に埋め込み済みなので
      # 同梱しない（docs/BUILD.md の「配布時に同梱するもの」）。exe はビルド成果物をそのまま添付し、
      # 資産名は版を含まない capturecard_viewer.exe（gh はパスの末尾をそのまま資産名にする）。
      # 資産名は自動アップデートが読むので変えない（docs/RELEASE.md の「配布物」）。
      # SHA256SUMS.txt の形式は sha256sum と同じ「<小文字の hash>  <ファイル名>」、BOM なしの UTF-8、改行は LF
      - name: 配布する exe と SHA-256 の一覧を作る
        run: |
          $exe = "target/release/capturecard_viewer.exe"
          $name = Split-Path -Path $exe -Leaf
          $hash = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $sums = "SHA256SUMS.txt"
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) $sums), "$hash  $name`n", (New-Object System.Text.UTF8Encoding $false))
          Get-Content -Path $sums
          "EXE=$exe" | Out-File -FilePath ${env:GITHUB_ENV} -Append -Encoding utf8
          "SUMS=$sums" | Out-File -FilePath ${env:GITHUB_ENV} -Append -Encoding utf8

      # 第三者の Action を増やさないよう、ランナーに入っている gh CLI を使う。
      # pre-release のタグは pre-release の印を付け、Latest にしない（/releases/latest から外れる）
      - name: GitHub Release を作る
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseArgs = @(${env:TAG}, ${env:EXE}, ${env:SUMS}, '--title', ${env:TAG}, '--notes-file', 'release-notes.md', '--verify-tag')
          if (${env:PRERELEASE} -eq 'true') {
            $releaseArgs += @('--prerelease', '--latest=false')
          }
          gh release create @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw "gh release create が失敗した（終了コード $LASTEXITCODE）" }
