# cargo audit（CI の「依存の脆弱性情報（RustSec）」ジョブ）の設定。
# 運用と理由は docs/DEPENDENCIES.md の「脆弱性情報（RustSec）の検査」。
#
# cargo audit はターゲットを区別せず Cargo.lock 全体を見る。ここに載せるのは
# 「Windows のビルドに入らない」か「対応する Issue で解消を待っている」勧告だけで、
# 1 件ごとに理由と Issue 番号を添える。解消したら行ごと消す。
# いまは載せている勧告が無い（webbrowser の RUSTSEC-2026-0257 は #300 で解消した）。
#
# unmaintained の警告（paste、2026-10-03 時点）は既定で失敗扱いにならないので
# 載せていない。paste は nokhwa 経由で手元では外せない。egui 0.26 の経由で出ていた
# derivative / instant / ttf-parser は #300 で egui を 0.36 へ上げて消えた。
[advisories]
ignore = []
