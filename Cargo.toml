[package]
name = "capturecard_viewer"
version = "1.0.6"
edition = "2021"
# 配布するアプリであってライブラリではない。crates.io へ公開しないことを明示する。
# cargo-about の private.ignore がこの指定を見て、本体を
# THIRD-PARTY-LICENSES.txt の一覧から除外する。
publish = false

[dependencies]
eframe = "0.26"
egui = "0.26"
nokhwa = { version = "0.10", features = ["input-msmf", "output-threaded", "decoding"] }
cpal = "0.15"
confy = "0.6"
# ログのファサード。出力先の実装は src/logging.rs にある
log = "0.4.34"
global-hotkey = "0.4"
serde = { version = "1.0", features = ["derive"] }
image = "0.24"
chrono = { version = "0.4", features = ["serde"] }
rodio = "0.17"
dirs = "5.0"
rfd = "0.11"
ringbuf = "0.3"

# テスト専用。設定の TOML を直接読み書きして検証するため
[dev-dependencies]
tempfile = "3.27"
toml = "1.1"

[build-dependencies]
embed-resource = "2.4"

[target.'cfg(windows)'.dependencies]
# ウィンドウ位置の復元時にモニタの作業領域を列挙する（src/main.rs の monitor_work_areas）
winapi = { version = "0.3", features = ["minwindef", "winuser", "windef"] }

[[bin]]
name = "capturecard_viewer"
path = "src/main.rs"

# 最適化設定
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
