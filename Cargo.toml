[package]
name = "capturecard_viewer"
version = "1.2.1"
edition = "2021"
# 配布するアプリであってライブラリではない。crates.io へ公開しないことを明示する。
# cargo-about の private.ignore がこの指定を見て、本体を
# THIRD-PARTY-LICENSES.txt の一覧から除外する。
publish = false

# println! / eprintln! を足し直すのを CI で止める。
# #![windows_subsystem = "windows"] でコンソールが無く、標準出力はどこにも
# 届かないため、ログは log クレートのマクロを使う（src/logging.rs）。
# CI は -D warnings なので、warn にしておけば混入した時点で落ちる。
[lints.clippy]
print_stdout = "warn"
print_stderr = "warn"

[dependencies]
eframe = "0.26"
egui = "0.26"
nokhwa = { version = "0.10", features = ["input-msmf", "output-threaded", "decoding"] }
# realtime は音声のスレッドを MMCSS（Pro Audio）で優先させる。0.15 は常に
# THREAD_PRIORITY_TIME_CRITICAL へ上げていたが、0.18 からはこのフィーチャが要る
cpal = { version = "0.18", features = ["realtime"] }
# 設定ファイルの読み書き（src/settings/store.rs）。confy は 0.6 から 2.0 へ上げずに外し、
# toml を直接使う（docs/DEPENDENCIES.md の第 3 段）。置き場所は dirs で決める
# （src/config_path.rs）。toml 自体は embed-resource（ビルド時）が既に使っている
toml = "1.1"
# ログのファサード。出力先の実装は src/logging.rs にある
log = "0.4.34"
serde = { version = "1.0", features = ["derive"] }
# スクリーンショットの保存（PNG / JPEG）、埋め込みアイコン（ICO）の読み込み、
# DirectShow の MJPEG の展開に使う。既定のフィーチャは AVIF のエンコーダ（rav1e）
# など使わない形式まで引き込むので切り、使う形式だけを足す
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
chrono = { version = "0.4", features = ["serde"] }
# 既定のフィーチャはマイクからの録音（recording）や MP4 / AAC、ディザ（rand）まで
# 引き込むので切る。0.17 の既定と同じ形式（MP3 / WAV / Ogg Vorbis / FLAC）だけを足す
rodio = { version = "0.22", default-features = false, features = ["playback", "mp3", "wav", "vorbis", "flac"] }
dirs = "7.0"
# 設定ダイアログのフォルダ選択とファイル選択。既定のフィーチャ（xdg-portal / wayland）は
# Linux 向けのバックエンドなので切る。Windows では IFileDialog を直接使い、フィーチャは要らない
rfd = { version = "0.17", default-features = false }
ringbuf = "0.5"
# スクリーンショットをクリップボードへコピーする。egui-winit が既に同じ版を
# 使っているため、クレート自体は増えない（image-data フィーチャの分だけ増える）
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
# 更新の確認（src/update/）。GitHub の Release API へ問い合わせるだけに使う。
# TLS は Windows の schannel（native-tls）で、証明書は OS の証明書ストアで検証する
# （`RootCerts::PlatformVerifier`）。既定の rustls と ring は入れない。
# ureq は native-tls を有効にすると同梱のルート証明書（webpki-root-certs）も
# 必ず引き込むが、使うのは OS の証明書ストアのほう。OS 側で信頼している証明書
# （社内のプロキシなど）にも従うため。
# **フィーチャは `native-tls` にすること。** `native-tls-no-default` だけでは
# ureq が native-tls を無効とみなし、問い合わせの時点でパニックする
ureq = { version = "3.4", default-features = false, features = ["native-tls"] }
serde_json = "1.0"
# 版の比較。クレート自体は他の依存が既に使っている
semver = "1.0"
# 更新の適用（src/update/apply.rs）。ダウンロードした exe を SHA256SUMS.txt と照合する
sha2 = "0.11"

# テスト専用。一時フォルダで設定ファイルなどの読み書きを検証するため
[dev-dependencies]
tempfile = "3.27"

[build-dependencies]
embed-resource = "3.0"

[target.'cfg(windows)'.dependencies]
# ウィンドウ位置の復元時にモニタの作業領域を列挙する（src/platform.rs の monitor_work_areas）。
# ホットキーの押下を低レベルキーボードフックで観測する（src/keyboard_hook.rs）。
# libloaderapi / processthreadsapi / winbase はフックの登録とメッセージの待ち受けに使う
winapi = { version = "0.3", features = ["minwindef", "winuser", "windef", "libloaderapi", "processthreadsapi", "winbase", "winnls"] }
# DirectShow のバックエンド（src/video/directshow/）と録画の Sink Writer（src/recording/）。winapi には DirectShow の
# インターフェースが無いため使う。nokhwa（nokhwa-bindings-windows）が同じ版を
# 既に使っているので、クレートは増えない。増えるのは下のフィーチャの分だけ
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Media_DirectShow",
    "Win32_Media_MediaFoundation",
    # 録画の保存先の空き容量（GetDiskFreeSpaceExW、src/recording/storage.rs）
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }
# 自前のレンダラーフィルターを `#[implement]` で書く。マクロが生成するコードは
# `windows_core` を直接参照するので、`windows` とは別に依存へ入れる
windows-core = "0.62"

[[bin]]
name = "capturecard_viewer"
path = "src/main.rs"

# 最適化設定
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
